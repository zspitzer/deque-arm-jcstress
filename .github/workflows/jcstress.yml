name: jcstress

# DequeArr slot-reuse and middle-insert tests on a weakly ordered CPU (arm64) against x86. Modes: fenced (the code as
# it ships), nofence (-Ddeque.fillnofence=true, fill's storeStoreFence off: arm64 shows FORBIDDEN for ReuseFill*), and
# novalidate (-Ddeque.novalidate=true, readers skip the epoch check: the negative control proving the tests can see a
# torn read). Expected: fenced clean everywhere. A clean run doesn't prove a fence is needed, only a hit does

on:
  workflow_dispatch:
  push:

jobs:
  jcstress:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04-arm, ubuntu-24.04 ]
        mode: [ fenced, nofence, novalidate ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: build
        run: mvn -B -q -f jcstress/pom.xml -DskipTests package

      # one JVM config (-jvmArgs disables the flag matrix, which plans ~590 configs per test in stress mode and blows
      # the 6h job limit), repeated so a rare reordering gets more chances; a FORBIDDEN hit fails the iteration, not the loop
      - name: jcstress
        run: |
          set -o pipefail
          JVM="-XX:+UnlockDiagnosticVMOptions"
          if [ "${{ matrix.mode }}" = "nofence" ]; then JVM="$JVM -Ddeque.fillnofence=true"; fi
          if [ "${{ matrix.mode }}" = "novalidate" ]; then JVM="$JVM -Ddeque.novalidate=true"; fi
          nproc
          rc=0
          for i in 1 2 3; do
            echo "=== iteration $i" | tee -a jcstress.txt
            java -jar jcstress/target/jcstress.jar -t 'DequeStress\.(ReuseFillSet|ReuseFillResize|ReuseEndNegativeKey|MiddleInsert\w+)' \
              -m stress -jvmArgs "$JVM" -r results/$i 2>&1 | grep -v -E "^\((ETA|Sampling|JVMs|CPUs|Results):" | tee -a jcstress.txt || rc=1
          done
          grep -E "FAILED|FORBIDDEN|passed|failed" jcstress.txt | tail -40
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jcstress-${{ matrix.os }}-${{ matrix.mode }}
          path: |
            jcstress.txt
            results
